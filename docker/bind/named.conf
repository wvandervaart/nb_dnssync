// Dev/test-only BIND config for docker-compose integration testing.
// The TSIG key/secret here is a throwaway dev value - do NOT reuse it
// against a real BIND server. See docker/dev-config.yaml for the matching
// nb_dnssync config.

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    recursion no;
};

key "nb-dnssync-key" {
    algorithm hmac-sha256;
    secret "6otESW/n7uVvaHc30Y/8VIp9B3y4Iii33R934Kc94y4=";
};

zone "example.com" {
    type master;
    file "/etc/bind/zones/db.example.com";
    allow-update { key "nb-dnssync-key"; };
    allow-transfer { key "nb-dnssync-key"; };
};

zone "devices.example.com" {
    type master;
    file "/etc/bind/zones/db.devices.example.com";
    allow-update { key "nb-dnssync-key"; };
    allow-transfer { key "nb-dnssync-key"; };
};

zone "0.0.10.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.0.0.10.in-addr.arpa";
    allow-update { key "nb-dnssync-key"; };
    allow-transfer { key "nb-dnssync-key"; };
};
